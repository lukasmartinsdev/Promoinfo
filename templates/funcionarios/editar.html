{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar funcionário | PromoInfo</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/area-restrita.css"><link rel="stylesheet" href="/funcionarios.css"></head><body><div id="siteHeader"></div><main class="employee-page"><div class="employee-topbar"><a href="{% url 'listar_funcionarios' %}">← Voltar aos funcionários</a><a href="/">Página inicial</a></div><section class="employee-shell"><div class="employee-copy"><span class="employee-kicker">GESTÃO DE PESSOAS</span><h1>Editar funcionário</h1><p>As alterações ficam registradas na auditoria da área restrita.</p></div><div class="employee-card">{% if messages %}{% for message in messages %}<div class="employee-alert employee-alert-{{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}<form method="post" class="employee-form">{% csrf_token %}<label>Nome<input name="nome" maxlength="150" value="{{ form_data.nome }}" required></label><label>CPF<input id="id_cpf" name="cpf" maxlength="14" value="{{ form_data.cpf }}" required></label><label>Cargo<input name="cargo" maxlength="100" value="{{ form_data.cargo }}" required></label><button>Salvar alterações</button></form></div></section></main><div id="siteFooter"></div><script src="/data.js"></script><script src="/marketplace.js"></script><script src="/shared.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{window.PromoUI?.renderHeader('');window.PromoUI?.renderFooter();});</script></body></html>
