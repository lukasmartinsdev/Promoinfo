<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff5a00">
  <meta name="description" content="Encontre lojas e stands nas unidades PromoInfo Mix.">
  <title>Lojas | PromoInfo Mix</title>
  <link rel="icon" href="assets/promoinfo-logo.png">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <div id="siteHeader"></div>
  <main>
    <section class="stores-hero">
      <div class="container stores-hero-inner"><div><span class="section-kicker light">DIRETÓRIO DE LOJAS</span><h1>Encontre a loja certa para o que você precisa.</h1><p>Pesquise por nome, especialidade, unidade ou número do stand.</p></div><div class="stores-hero-stat"><strong id="directoryCount">99</strong><span>cadastros públicos organizados</span></div></div>
    </section>

    <section class="section stores-directory-section">
      <div class="container">
        <div class="directory-toolbar">
          <label class="directory-search"><span data-icon="search"></span><input id="storeSearch" placeholder="Buscar loja, stand, unidade ou especialidade"></label>
          <div class="unit-filters" id="unitFilters"></div>
        </div>
        <div class="section-head compact"><div><span class="section-kicker">LOJAS EM DESTAQUE</span><h2>Perfis com informações completas</h2></div></div>
        <div class="store-cards" id="fullStoreCards"></div>
        <div class="section-head directory-head"><div><span class="section-kicker">TODAS AS LOJAS</span><h2>Diretório da rede</h2><p id="directorySummary"></p></div></div>
        <div class="directory-grid" id="directoryGrid"></div>
        <div class="center-actions"><button class="btn btn-secondary" id="moreStoresBtn" type="button">Mostrar mais lojas</button></div>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="catalogo-importado.js"></script>
  <script src="data.js"></script>
  <script src="marketplace.js"></script>
  <script src="shared.js?v=13"></script>
  <script src="stores.js"></script>
</body>
</html>
